# the mock mailbox is the default in tests: send for real, to the SMTP stub the test resource starts
quarkus.mailer.mock=false
quarkus.mailer.from=shop@example.com
quarkus.mailer.host=${smtp.host}
quarkus.mailer.port=${smtp.port}
# the blocking mailer waits this long: the bound of a hung SMTP server
quarkus.mailer.timeout=2s

quarkus.mailer.alerts.mock=false
quarkus.mailer.alerts.from=alerts@example.com
quarkus.mailer.alerts.host=${smtp.host}
quarkus.mailer.alerts.port=${smtp.port}
quarkus.mailer.alerts.timeout=2s

quarkus.log.category."io.quarkiverse.resiliencytesting".level=DEBUG
