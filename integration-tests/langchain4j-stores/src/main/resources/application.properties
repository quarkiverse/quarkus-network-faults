# the chat model, a stub whose URL comes from the test resource
quarkus.langchain4j.openai.base-url=${llm.openai.url}/v1/
quarkus.langchain4j.openai.api-key=test
quarkus.langchain4j.openai.chat-model.model-name=gpt-test
quarkus.langchain4j.timeout=2s
quarkus.langchain4j.devservices.enabled=false

# the chat memory lives in Redis, from Dev Services; the data source waits this long for a reply: the bound of a hung Redis
quarkus.redis.timeout=2s

# the default embedding store is pgvector on the default datasource, a PostgreSQL from Dev Services with the pgvector image
quarkus.datasource.db-kind=postgresql
quarkus.langchain4j.pgvector.dimension=3

# Chroma, from Dev Services too, provides a named store only, so that the default one stays unambiguous
quarkus.langchain4j.chroma.default-store-enabled=false
quarkus.langchain4j.chroma.c1.collection-name=embeddings

quarkus.log.category."io.quarkiverse.resiliencytesting".level=DEBUG
