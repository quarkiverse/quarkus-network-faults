# the integration-test modules run back to back; a random port keeps one from meeting the other's still-bound one
quarkus.http.test-port=0

# a small pool, and no queue in front of it: a request that finds no free worker is rejected, and Quarkus answers
# it with a 503 instead of letting it wait for as long as it takes
quarkus.thread-pool.max-threads=4
quarkus.thread-pool.queue-size=0
