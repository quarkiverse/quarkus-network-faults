# the integration-test modules run back to back; a random port keeps one from meeting the other's still-bound one
quarkus.http.test-port=0

# PostgreSQL from Dev Services: no URL, so a container is started for each datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.max-size=3
# keep the exhausted-pool tests short: a query waiting for a connection gives up after this long
quarkus.datasource.reactive.connection-timeout=1S

# a second, named datasource: a fault on one must leave the other alone
quarkus.datasource."audit".db-kind=postgresql
quarkus.datasource."audit".reactive.max-size=2
quarkus.datasource."audit".reactive.connection-timeout=1S

# a third datasource whose callers are turned away at once instead of waiting: no wait queue, so the fault has no
# guard for it
quarkus.datasource."burst".db-kind=postgresql
quarkus.datasource."burst".reactive.max-size=1
quarkus.datasource."burst".reactive.max-wait-queue-size=0

# a fourth datasource whose connection timeout outlasts the wait of exhausted() itself, as the default of 30 seconds does
quarkus.datasource."patient".db-kind=postgresql
quarkus.datasource."patient".reactive.max-size=2
quarkus.datasource."patient".reactive.connection-timeout=30S

# a fifth datasource whose callers wait, but for less than the guard's sampler can see: no guard for it either. It
# only needs a pool of its own, not a database, so it shares the default datasource's container
quarkus.datasource."hasty".db-kind=postgresql
quarkus.datasource."hasty".devservices.enabled=false
quarkus.datasource."hasty".reactive.url=${quarkus.datasource.reactive.url}
quarkus.datasource."hasty".username=${quarkus.datasource.username}
quarkus.datasource."hasty".password=${quarkus.datasource.password}
quarkus.datasource."hasty".reactive.max-size=1
quarkus.datasource."hasty".reactive.connection-timeout=1ms
