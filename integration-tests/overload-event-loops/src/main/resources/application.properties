# the integration-test modules run back to back; a random port keeps one from meeting the other's still-bound one
quarkus.http.test-port=0

# a block is reported once an event loop has run one task for this long, checked this often; far below the
# 2-second production default, far above anything a non-blocking handler does
quarkus.vertx.max-event-loop-execute-time=100ms
quarkus.vertx.warning-exception-time=100ms
quarkus.vertx.blocked-thread-check-interval=10ms

# PostgreSQL Dev Services, so a proxy has a wire to sit on; a query that meets a hang gives up after this long
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=2
