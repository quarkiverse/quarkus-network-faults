# one named model per provider, plus the unnamed default one on OpenAI; the stub URLs come from the test resource
quarkus.langchain4j.chat-model.provider=openai
quarkus.langchain4j.openai.base-url=${llm.openai.url}/v1/
quarkus.langchain4j.openai.api-key=test
quarkus.langchain4j.openai.chat-model.model-name=gpt-test

quarkus.langchain4j.m-openai.chat-model.provider=openai
quarkus.langchain4j.openai.m-openai.base-url=${llm.openai.url}/v1/
quarkus.langchain4j.openai.m-openai.api-key=test
quarkus.langchain4j.openai.m-openai.chat-model.model-name=gpt-test

quarkus.langchain4j.m-ollama.chat-model.provider=ollama
quarkus.langchain4j.ollama.m-ollama.base-url=${llm.ollama.url}
quarkus.langchain4j.ollama.m-ollama.chat-model.model-id=llama-test

quarkus.langchain4j.m-anthropic.chat-model.provider=anthropic
quarkus.langchain4j.anthropic.m-anthropic.base-url=${llm.anthropic.url}/v1/
quarkus.langchain4j.anthropic.m-anthropic.api-key=test
quarkus.langchain4j.anthropic.m-anthropic.chat-model.model-name=claude-test

# the client-side timeout of every model call. It, not the @Timeout in Summaries, is what bounds a hung model:
# SmallRye FT interrupts the thread at 1s but the blocking model client does not react to interruption
quarkus.langchain4j.timeout=2s

quarkus.log.category."io.quarkiverse.resiliencytesting".level=DEBUG

# a local Ollama was found on the build machine; the stubs stand in for every model
quarkus.langchain4j.devservices.enabled=false
quarkus.langchain4j.ollama.devservices.enabled=false
