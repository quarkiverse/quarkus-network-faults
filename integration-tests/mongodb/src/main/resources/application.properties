# MongoDB 8.3 refuses to start on Linux kernels 6.19 and newer (SERVER-121912); 7.0 runs everywhere
quarkus.mongodb.devservices.image-name=mongo:7.0

# bounds a refused or hung server: the driver otherwise waits 30s to select a server
quarkus.mongodb.server-selection-timeout=2s
quarkus.mongodb.connect-timeout=2s
quarkus.mongodb.read-timeout=2s

quarkus.log.category."io.quarkiverse.resiliencytesting".level=DEBUG
