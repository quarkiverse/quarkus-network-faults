quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=4
quarkus.datasource.jdbc.acquisition-timeout=PT2S
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=2
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=2
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

quarkus.log.category."io.quarkiverse.resiliencytesting".level=DEBUG
