mp.messaging.outgoing.orders-out.connector=smallrye-kafka
mp.messaging.outgoing.orders-out.topic=orders
# bounded producer waits, so a broker fault surfaces as an error in seconds rather than minutes
mp.messaging.outgoing.orders-out.max.block.ms=3000
mp.messaging.outgoing.orders-out.delivery.timeout.ms=3000
mp.messaging.outgoing.orders-out.request.timeout.ms=2000
mp.messaging.outgoing.orders-out.linger.ms=0
# SmallRye raises the client's reconnect backoff cap from 1 s to 10 s; after a fault of a few seconds the producer's
# next connection attempt would then fall outside max.block.ms, and the first send after the fault would time out
mp.messaging.outgoing.orders-out.reconnect.backoff.max.ms=1000

mp.messaging.incoming.orders-in.connector=smallrye-kafka
mp.messaging.incoming.orders-in.topic=orders
mp.messaging.incoming.orders-in.auto.offset.reset=earliest

quarkus.log.category."io.quarkiverse.resiliencytesting".level=DEBUG
