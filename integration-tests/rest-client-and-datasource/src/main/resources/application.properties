quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=4
quarkus.datasource.jdbc.acquisition-timeout=PT2S
quarkus.datasource.jdbc.foreground-validation-interval=PT0.001S
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=2
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=2

# profile prefix plus expression on purpose: the fault interceptor must see the resolved value
%test.quarkus.rest-client.inventory.url=${inventory.url}
quarkus.rest-client.inventory.connect-timeout=1000
quarkus.rest-client.inventory.read-timeout=2000

quarkus.log.category."io.quarkiverse.networkfaults".level=DEBUG

# a second, named datasource with its own Dev Services database: faults on one must not touch the other. Its pool is
# small and gives up quickly, and its database timeouts are long, so that a pool exhausted by a hung database fails a
# request on the acquisition timeout at a time nothing else could explain. The name is quoted, as Quarkus itself
# writes it: with Quarkus 4.0.0.Beta1 the unquoted form left the pool on its defaults
quarkus.datasource."audit".db-kind=postgresql
quarkus.datasource."audit".jdbc.max-size=2
quarkus.datasource."audit".jdbc.acquisition-timeout=PT1S
quarkus.datasource."audit".jdbc.additional-jdbc-properties.socketTimeout=10
quarkus.datasource."audit".jdbc.additional-jdbc-properties.connectTimeout=10

# the export client streams a large upload through a throttled proxy, so its read timeout has to outlast the upload
%test.quarkus.rest-client.export.url=${inventory.url}
quarkus.rest-client.export.read-timeout=30000
