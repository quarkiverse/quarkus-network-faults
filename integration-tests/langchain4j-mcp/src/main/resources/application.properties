# one MCP server over the streamable HTTP transport; the stub URL comes from the test resource
quarkus.langchain4j.mcp.weather.transport-type=streamable-http
quarkus.langchain4j.mcp.weather.url=${mcp.weather.url}/mcp
# the stateful protocol the stub speaks; left unset, the client probes for the newer one first
quarkus.langchain4j.mcp.weather.protocol-version=2025-11-25
# the bound of a hung tool call
quarkus.langchain4j.mcp.weather.tool-execution-timeout=2s
# no pings in the background: the tests count the requests they send
quarkus.langchain4j.mcp.weather.auto-health-check=false

quarkus.log.category."io.quarkiverse.resiliencytesting".level=DEBUG
