# the integration-test modules run back to back; a random port keeps one from meeting the other's still-bound one
quarkus.http.test-port=0

# both datasources run on PostgreSQL Dev Services, so a proxy has a wire to sit on
quarkus.datasource.db-kind=postgresql
# keep the exhausted-pool tests short: a caller gives up after this long
quarkus.datasource.jdbc.acquisition-timeout=1S
quarkus.datasource.jdbc.max-size=5

# a second, named datasource: a fault on one must leave the other alone. Strict multiple acquisition forbids a thread
# holding two of its connections, which is what taking a whole pool from one thread would do
quarkus.datasource."audit".db-kind=postgresql
quarkus.datasource."audit".jdbc.acquisition-timeout=1S
quarkus.datasource."audit".jdbc.max-size=2
quarkus.datasource."audit".jdbc.multiple-acquisition=strict
# Agroal clears the holding thread on return only when leak detection is on: without it, strict acquisition refuses
# a reused worker thread until the next flush
quarkus.datasource."audit".jdbc.leak-detection-interval=1H
quarkus.datasource."audit".jdbc.additional-jdbc-properties.socketTimeout=2
