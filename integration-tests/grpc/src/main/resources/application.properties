# the client calls this application's own gRPC service, served on the HTTP port; in tests Quarkus uses test-port
quarkus.grpc.clients.greeter.host=localhost
quarkus.grpc.clients.greeter.port=${quarkus.http.port:8080}
quarkus.grpc.clients.greeter.test-port=${quarkus.http.test-port:8081}

quarkus.log.category."io.quarkiverse.resiliencytesting".level=DEBUG
