# The inventory service is served by this application itself (InventoryResource), so the client calls back into
# the same process. The property is what the Resiliency Testing proxy takes over in dev mode and in tests.
quarkus.http.port=8080
quarkus.rest-client.inventory.url=http://localhost:8080
# tests start the application on the test port
%test.quarkus.rest-client.inventory.url=http://localhost:8081
quarkus.rest-client.inventory.connect-timeout=1000
# longer than the @Timeout on InventoryService.reserve, so that a hang is bounded by the application's timeout, not
# the client's
quarkus.rest-client.inventory.read-timeout=5000

# PostgreSQL through Dev Services (needs Docker). A small pool with a short acquisition timeout, so that a hung
# database exhausts the pool quickly and the next request fails on the acquisition timeout rather than waiting.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=4
quarkus.datasource.jdbc.acquisition-timeout=PT2S
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=3
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=3
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Fault injection is build-time configuration: on in dev mode for the card and the tools, off everywhere else.
# Tests turn it on through @TestProfile(NetworkFaultsProfile.class).
%dev.quarkus.resiliency-testing.enabled=true

# The Dev MCP server at /q/dev-mcp, so that an AI agent can drive the card's tools.
quarkus.dev-mcp.enabled=true

quarkus.log.category."io.quarkiverse.resiliencytesting".level=INFO
