# the sample modules run back to back; a random port keeps one from meeting the other's still-bound one
quarkus.http.test-port=0

# PostgreSQL from Dev Services: no URL, so a container is started for the tests
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true

# a small pool, and callers that give up quickly, so that the tests are short. Neither number matters to the
# behaviour under test: a full pool of five behaves as a full pool of fifty
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.acquisition-timeout=500ms
