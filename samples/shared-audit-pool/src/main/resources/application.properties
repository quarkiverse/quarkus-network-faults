# the sample modules run back to back; a random port keeps one from meeting the other's still-bound one
quarkus.http.test-port=0

# PostgreSQL from Dev Services: no URL, so a container is started for the tests
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true

# a small pool, and callers that give up quickly, so that the tests are short
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.acquisition-timeout=500ms

# the fix: a datasource of its own for the audit log, with its own pool. It is declared here because the set of
# datasources is fixed at build time, and switched on by the test profile
quarkus.datasource."audit".db-kind=postgresql
quarkus.datasource."audit".active=false
quarkus.datasource."audit".devservices.init-script-path=audit-schema.sql
quarkus.datasource."audit".jdbc.max-size=2
quarkus.datasource."audit".jdbc.acquisition-timeout=500ms
