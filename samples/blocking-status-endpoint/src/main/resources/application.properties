# the sample modules run back to back; a random port keeps one from meeting the other's still-bound one
quarkus.http.test-port=0

# a small worker pool, so that the tests are short, and no queue in front of it: a request that finds no free
# worker is answered 503 instead of waiting
quarkus.thread-pool.max-threads=4
quarkus.thread-pool.queue-size=0
