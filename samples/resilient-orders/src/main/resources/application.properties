# The inventory and payment services are served by this application itself (InventoryStub, PaymentStub), so the
# clients call back into the same process. The URL properties are what the Network faults proxy takes over in tests.
quarkus.rest-client.inventory.url=http://localhost:8080
quarkus.rest-client.payments.url=http://localhost:8080
# tests start the application on the test port
%test.quarkus.rest-client.inventory.url=http://localhost:8081
%test.quarkus.rest-client.payments.url=http://localhost:8081
quarkus.rest-client.shipping.url=http://localhost:8080
%test.quarkus.rest-client.shipping.url=http://localhost:8081
quarkus.rest-client.inventory.connect-timeout=1000
# longer than the @Timeout on InventoryService.reserve, so that a hang is bounded by the application's timeout, not
# the client's
quarkus.rest-client.inventory.read-timeout=5000
quarkus.rest-client.payments.read-timeout=2000

# PostgreSQL through Dev Services (needs Docker). The PostgreSQL JDBC driver waits forever for an answer by default:
# without these timeouts, a database that hangs hangs every request that queries it.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=3
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=3
# Agroal hands out pooled connections without checking them by default: after a database restart, the first request
# gets a dead connection. Validating them before use replaces the dead ones.
quarkus.datasource.jdbc.foreground-validation-interval=PT0.001S
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Kafka through Dev Services. A producer waits up to 60 seconds for metadata and 120 seconds for an acknowledgement by
# default; an order request should not.
mp.messaging.outgoing.order-events.connector=smallrye-kafka
mp.messaging.outgoing.order-events.topic=order-events
mp.messaging.outgoing.order-events.max.block.ms=3000
mp.messaging.outgoing.order-events.request.timeout.ms=2000
mp.messaging.outgoing.order-events.delivery.timeout.ms=3000
mp.messaging.outgoing.order-events.linger.ms=0
# Every placed order is shipped. An order whose shipping keeps failing goes to the dead-letter topic
# dead-letter-topic-orders-to-ship instead of stopping the consumer, which is what the default failure strategy does.
mp.messaging.incoming.orders-to-ship.connector=smallrye-kafka
mp.messaging.incoming.orders-to-ship.topic=order-events
mp.messaging.incoming.orders-to-ship.failure-strategy=dead-letter-queue

# Redis through Dev Services. Its client waits 10 seconds for an answer by default; a cache that slow is worse than no
# cache.
quarkus.redis.timeout=200ms

# An OpenAI model named "assistant". Its client retries a failed call once by default
# (quarkus.langchain4j.openai.assistant.max-retries=1). Tests point it at a stub, see LlmStub.
quarkus.langchain4j.assistant.chat-model.provider=openai
quarkus.langchain4j.openai.assistant.api-key=${OPENAI_API_KEY:none}
%test.quarkus.langchain4j.openai.assistant.base-url=${llm.url:http://localhost:1}/v1/
