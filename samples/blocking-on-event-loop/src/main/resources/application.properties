# the sample modules run back to back; a random port keeps one from meeting the other's still-bound one
quarkus.http.test-port=0

# PostgreSQL from Dev Services: no URL, so a container is started for the tests
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true

# a small pool, and callers that give up quickly, so that the tests are short
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.acquisition-timeout=500ms

# for the tests, an event loop counts as blocked once it has run one task for this long, checked this often: far
# below the 2-second production default, far above anything a non-blocking handler does
%test.quarkus.vertx.max-event-loop-execute-time=100ms
%test.quarkus.vertx.warning-exception-time=100ms
%test.quarkus.vertx.blocked-thread-check-interval=10ms
