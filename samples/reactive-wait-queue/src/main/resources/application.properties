# the sample modules run back to back; a random port keeps one from meeting the other's still-bound one
quarkus.http.test-port=0

# PostgreSQL from Dev Services: no URL, so a container is started for the tests, and the schema comes from a script
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.init-script-path=schema.sql

# a small pool, so that the tests are short. The bug is what is missing here: with no
# quarkus.datasource.reactive.max-wait-queue-size, queries that find no free connection queue without limit, for
# up to the connection timeout of thirty seconds
quarkus.datasource.reactive.max-size=3
