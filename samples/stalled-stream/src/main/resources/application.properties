# the sample modules run back to back; a random port keeps one from meeting the other's still-bound one
quarkus.http.test-port=0

# the inventory service is a stub the tests start (InventoryServer), on a port it reports in inventory.url. The
# profile prefix and the expression are both on purpose: the proxy takes over the resolved value of this property
%test.quarkus.rest-client.inventory.url=${inventory.url}

# two seconds, set on purpose: this is the timeout everyone expects to bound a stream that goes quiet, and the bug
# is that it does not. It bounds the wait for the response headers, and Vert.x cancels it once they have arrived
quarkus.rest-client.inventory.read-timeout=2000
